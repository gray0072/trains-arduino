  <rect x="314" y="133" width="24" height="11" rx="2" fill="#1B2A34" stroke="#000" stroke-width="3"/><rect x="348" y="133" width="24" height="11" rx="2" fill="#1B2A34" stroke="#000" stroke-width="3"/><rect x="382" y="133" width="24" height="11" rx="2" fill="#1B2A34" stroke="#000" stroke-width="3"/>
