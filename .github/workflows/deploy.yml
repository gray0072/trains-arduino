name: Deploy remote-web to GitHub Pages

# Every push to main that touches the web remote builds remote-web/ and
# publishes it to https://gray0072.github.io/trains-arduino/. The firmware
# folders are not part of the site, so changes there don't trigger a deploy.
on:
  push:
    branches: [main]
    paths:
      - "remote-web/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: remote-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: remote-web/package-lock.json
      - run: npm ci
      # Actions sets CI=true, so react-scripts fails the build on any lint warning.
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: remote-web/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
